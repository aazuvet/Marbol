<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0">
<title>MARBOL - Proxy Play</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#0d0c1d;color:white}#gameFrame{width:100%;height:100%;border:0}</style>
</head>
<body class="max-w-[420px] mx-auto bg-[#0d0c1d] min-h-screen relative pb-[100px]">

<div class="px-4 pt-4 flex items-center justify-between">
  <div class="flex items-center gap-2"><div class="w-8 h-8 rounded-full bg-[#ff4d1a] flex items-center justify-center font-bold">M</div><span class="font-bold">MARBOL</span><span class="text-[10px] bg-[#22c55e] text-black px-2 py-0.5 rounded-full ml-1">ANTI-BLOKIR</span></div>
</div>

<div class="mt-4 px-3 grid grid-cols-3 gap-3" id="grid"></div>

<div id="player" class="fixed inset-0 z-50 bg-black hidden flex-col">
  <div class="h-[56px] px-3 flex items-center justify-between bg-[#17132f] border-b border-white/10 shrink-0">
    <button onclick="closePlayer()" class="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center">✕</button>
    <div class="flex-1 text-center"><div class="text-[13px] font-bold" id="playerTitle"></div><div class="text-[10px] text-white/50">PG Soft via Proxy</div></div>
    <button onclick="toggleFullscreen()" id="fsBtn" class="w-9 h-9 rounded-full bg-[#7c5cff] flex items-center justify-center">⛶</button>
  </div>
  <div class="flex-1 relative bg-black">
    <iframe id="gameFrame" allow="autoplay; fullscreen" allowfullscreen referrerpolicy="no-referrer"></iframe>
    <div id="loader" class="absolute inset-0 bg-[#0d0c1d] flex flex-col items-center justify-center gap-3 p-4 text-center">
      <div class="w-8 h-8 border-2 border-white/20 border-t-[#7c5cff] rounded-full animate-spin"></div>
      <div class="text-[12px]">Loading via proxy anti-blokir...</div>
      <div class="text-[10px] text-white/30" id="loadUrl"></div>
      <button onclick="requestFS()" class="mt-2 text-[11px] bg-[#7c5cff] px-4 py-2 rounded-full font-bold">FULLSCREEN</button>
    </div>
  </div>
  <div class="bg-[#131027] border-t border-white/10 p-3 flex items-center justify-between text-[10px]">
    <span class="text-white/40">Jika masih blank, domain diblokir operator. Coba pakai VPN atau tap ↗ untuk buka di tab baru.</span>
    <button onclick="openExternal()" class="ml-2 bg-[#ff4d1a] px-3 py-1.5 rounded-full text-[11px] font-bold">Buka ↗</button>
  </div>
</div>

<nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[420px] z-30" id="bottomNav">
  <div class="mx-2 mb-2 rounded-[24px] bg-[#131027]/95 backdrop-blur-xl border border-white/[0.08] px-2 py-2 flex justify-between">
    <div class="flex flex-col items-center justify-center min-w-[52px] h-[52px] rounded-[16px] bg-[#1e1a3d] border border-[#7c5cff]/30 text-[#ffcc4a]"><span>⌂</span><span class="text-[9px] mt-1">Beranda</span></div>
    <div class="flex flex-col items-center min-w-[52px] text-white/40 py-2"><span>🎁</span></div>
    <div class="flex flex-col items-center min-w-[52px] text-white/40 py-2"><span>👥</span></div>
    <div class="flex flex-col items-center min-w-[52px] text-white/40 py-2"><span>💳</span></div>
    <div class="flex flex-col items-center min-w-[52px] text-white/40 py-2"><span>👤</span></div>
  </div>
</nav>

<script>
// Gunakan link yang TIDAK diblokir di Indo - superslot.game + proxy
// superslot.game tidak di blokir, dia yang load PG di backend
const GAMES = [
  {name:"Mahjong Ways",demo:"https://superslot.game/pgslot/mahjong-ways/",theme:"from-[#ff4d1a] to-[#ff8a4a]",icon:"🀄",rtp:"96.92%"},
  {name:"Mahjong Ways 2",demo:"https://superslot.game/pgslot/mahjong-ways-2/",theme:"from-[#1a8a3a] to-[#4ade80]",icon:"🀄",rtp:"96.95%"},
  {name:"Legend of Perseus",demo:"https://superslot.game/pgslot/legend-of-perseus/",theme:"from-[#3a2a6a] to-[#7c5cff]",icon:"⚔️",rtp:"96.83%"},
  {name:"Battleground Royale",demo:"https://superslot.game/pgslot/battleground-royale/",theme:"from-[#b45309] to-[#fbbf24]",icon:"⚔️",rtp:"96.71%"},
  {name:"Ways of Qilin",demo:"https://superslot.game/pgslot/ways-of-the-qilin/",theme:"from-[#7c2d12] to-[#fb7185]",icon:"🦁",rtp:"96.81%"},
  {name:"Fortune Tiger",demo:"https://superslot.game/pgslot/fortune-tiger/",theme:"from-[#0e7490] to-[#22d3ee]",icon:"🐯",rtp:"96.81%"},
  {name:"Lucky Neko",demo:"https://superslot.game/pgslot/lucky-neko/",theme:"from-[#831843] to-[#f43f5e]",icon:"🐱",rtp:"96.73%"},
  {name:"Ganesha Gold",demo:"https://superslot.game/pgslot/ganesha-gold/",theme:"from-[#1e3a8a] to-[#60a5fa]",icon:"🐘",rtp:"96.90%"},
  {name:"Wild Bandito",demo:"https://superslot.game/pgslot/wild-bandito/",theme:"from-[#14532d] to-[#22c55e]",icon:"🤠",rtp:"96.73%"},
];

let currentDemo="";

function render(){
  document.getElementById('grid').innerHTML=GAMES.map((g,i)=>`
    <div onclick="play(${i})" class="rounded-[16px] overflow-hidden bg-[#17132f] border border-white/5 active:scale-95 cursor-pointer">
      <div class="aspect-[3/4] bg-gradient-to-br ${g.theme} relative p-2 flex flex-col justify-between">
        <span class="text-[9px] bg-black/60 px-2 py-0.5 rounded-full w-fit z-10">${Math.floor(Math.random()*30+60)} online</span>
        <div class="z-10"><div class="text-[20px]">${g.icon}</div><div class="text-[10px] font-black leading-tight mt-1">${g.name.toUpperCase()}</div><div class="text-[8px] bg-white text-black px-1.5 py-0.5 rounded-full w-fit mt-1 font-bold">PLAY ANTI-BLOKIR</div></div>
        <div class="absolute bottom-0 inset-x-0 h-[50%] bg-gradient-to-t from-black/80 to-transparent"></div>
      </div>
      <div class="p-2"><div class="text-[11px] font-semibold truncate">${g.name}</div><div class="text-[9px] text-white/40">RTP ${g.rtp}</div></div>
    </div>
  `).join('');
}

function play(i){
  const g=GAMES[i];
  currentDemo=g.demo;
  document.getElementById('playerTitle').innerText=g.name;
  document.getElementById('loadUrl').innerText=g.demo;
  document.getElementById('loader').style.display='flex';
  document.getElementById('player').classList.remove('hidden');
  document.getElementById('player').classList.add('flex');
  document.getElementById('bottomNav').style.display='none';
  // Gunakan proxy https://api.allorigins.win/raw?url= atau langsung superslot.game
  // superslot.game biasanya tidak blok iframe
  document.getElementById('gameFrame').src=g.demo;
  document.getElementById('gameFrame').onload=()=>{ setTimeout(()=>{document.getElementById('loader').style.display='none'},1000) };
  setTimeout(()=>requestFS(),500);
}

function closePlayer(){
  exitFS();
  document.getElementById('player').classList.add('hidden');
  document.getElementById('player').classList.remove('flex');
  document.getElementById('gameFrame').src='';
  document.getElementById('bottomNav').style.display='block';
}

function requestFS(){
  const el=document.getElementById('player');
  try{ if(el.requestFullscreen) el.requestFullscreen(); }catch(e){}
}
function exitFS(){ try{ if(document.exitFullscreen) document.exitFullscreen(); }catch(e){} }
function toggleFullscreen(){ if(document.fullscreenElement) exitFS(); else requestFS(); }
function openExternal(){ if(currentDemo) window.open(currentDemo,'_blank'); }

render();
</script>
</body>
</html>
